name: CI

on:
  push:
  pull_request:
  # Catches drift from dependencies and the toolchain during stretches with no
  # push/PR. Host source isn't available in CI, so this can only verify what's
  # inside this repository.
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

# Every job here only needs read access. Carrying the default write permission
# around would let a compromised dependency action reach as far as pushing or
# releasing.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Docs (textlint)
        run: bun run textlint
      # Links, anchors, English/Japanese twin parity, English line width, and
      # one Japanese sentence per line — the executable form of the checklist in
      # docs/conventions.md.
      - name: Docs (structure)
        run: bun run check:docs
      # The site build is where a broken cross-document link surfaces. Without
      # this, a dead link would only be caught by the deploy on main.
      - name: Docs (site build)
        run: bun run docs:build
      - name: Test
        run: |
          bun --filter '@yosegi/*' test
          # scripts/ doesn't belong to any package, so --filter won't pick it up; run it explicitly.
          bun run test:scripts
      - name: Typecheck
        run: |
          bun --filter '@yosegi/*' typecheck
          bun run typecheck:scripts
      - name: Build (publish artifacts)
        run: bun run build

  # Consumers are assumed not to have Bun, so a successful build inside the
  # workspace guarantees nothing. This job installs the tarball with npm and
  # runs the CLI under Node alone. Node is pinned to the engines lower bound
  # (22), since it's more likely to work at the upper bound and fail at the
  # lower one than the other way around.
  node-consumer:
    name: Node consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      # Built with the same script release.yml uses to publish. If the tarball
      # verified here differed from what actually gets published, this job
      # would guarantee nothing.
      - name: Pack exactly what release publishes
        run: bun run scripts/pack.ts /tmp/yosegi-tarballs
      - name: Install the tarballs with npm, outside the workspace
        # zizmor: ignore[adhoc-packages] simulates a host installing its own
        # copies plus our tarball ad hoc; no lockfile is the point of the test.
        run: |
          mkdir -p /tmp/yosegi-consumer
          cd /tmp/yosegi-consumer
          npm init -y > /dev/null
          # Simulates a host that already has its own copy of everything yosegi
          # exposes through a published .d.ts, at the newest version yosegi
          # claims to support. The ranges are read back out of the tarballs
          # rather than repeated here, so this cannot drift from what ships.
          # Installing @latest instead would assert compatibility with majors
          # the package never promised; those are Renovate's job, not this one.
          specs=()
          for tgz in /tmp/yosegi-tarballs/*.tgz; do
            tar -xzOf "$tgz" package/package.json > /tmp/manifest.json
            for pkg in typescript hono zod @modelcontextprotocol/sdk; do
              range="$(node -e 'const d=require("/tmp/manifest.json").dependencies||{};if(d[process.argv[1]])console.log(d[process.argv[1]])' "$pkg")"
              if [ -n "$range" ]; then
                specs+=("${pkg}@${range}")
              fi
            done
          done
          printf 'host installs: %s\n' "${specs[*]}"
          npm install --no-audit --no-fund "${specs[@]}"
          npm install --no-audit --no-fund /tmp/yosegi-tarballs/*.tgz
      - name: Check the host's own copies were reused, not duplicated
        run: |
          cd /tmp/yosegi-consumer
          # A duplicate here means an exact pin, or a range narrower than it
          # looks, kept the host's own copy from being reused. For a nominally
          # typed class (Hono, McpServer) that is a type error the consumer
          # cannot work around, so it fails the build rather than warns.
          # Keep this list in step with the one in the install above.
          duplicated=""
          for pkg in typescript hono zod @modelcontextprotocol/sdk; do
            found="$(find node_modules -type d -path "*node_modules/${pkg}")"
            copies="$(printf '%s\n' "$found" | grep -c . || true)"
            echo "${pkg}: ${copies}"
            printf '%s\n' "$found"
            if [ "$copies" -ne 1 ]; then
              duplicated="${duplicated} ${pkg}"
            fi
          done
          if [ -n "$duplicated" ]; then
            echo "Duplicated in the consumer's tree:${duplicated}"
            exit 1
          fi
      - name: Print usage under Node
        run: |
          cd /tmp/yosegi-consumer
          set +e
          node ./node_modules/.bin/yosegi > usage.txt 2>&1
          status=$?
          set -e
          cat usage.txt
          # Running with no arguments should print usage and exit 1. A failed
          # module load also exits non-zero, so we check both that the exit
          # code is 1 and that usage was actually printed.
          test "$status" -eq 1
          grep -q "Yosegi CLI" usage.txt
      - name: Build a registry from a fixture host under Node
        # zizmor: ignore[adhoc-packages] simulates a host installing its own
        # React copy ad hoc; no lockfile is the point of the test.
        run: |
          cd /tmp/yosegi-consumer
          mkdir -p host/components
          cat > host/tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ESNext",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "jsx": "react-jsx",
              "strict": true,
              "skipLibCheck": true,
              "noEmit": true
            },
            "include": ["components/**/*.tsx"]
          }
          JSON
          cat > host/components/badge.tsx <<'TSX'
          import type * as React from "react";

          export type BadgeProps = {
            /** The text shown inside the badge. */
            label: string;
            /** Visual weight of the badge. */
            tone?: "neutral" | "success" | "danger";
            /** Rendered to the right of the label. */
            trailing?: React.ReactNode;
          };

          export function Badge({ label, tone = "neutral", trailing }: BadgeProps) {
            return <span data-tone={tone}>{label}{trailing}</span>;
          }
          TSX
          npm install --no-audit --no-fund react @types/react
          # Deliberately not passing --data-dir, to also confirm the default save location lives on the host side.
          node ./node_modules/.bin/yosegi registry build \
            --source "components/**/*.tsx" \
            --tsconfig ./host/tsconfig.json
          test -f ./.yosegi/registry.json
          # If the default save location ever moves back inside node_modules,
          # a reinstall would wipe the consumer's data, and it would also
          # fail to write at all under a read-only mount.
          test ! -e ./node_modules/@yosegi/yosegi/data
          # Also confirms props are actually read from the types. The file
          # being created alone would pass even if extraction came up empty.
          node ./node_modules/.bin/yosegi component inspect \
            "components/badge#Badge" | tee inspect.txt
          grep -q 'options: "neutral" | "success" | "danger"' inspect.txt

  # TypeScript 7.0 ships no compiler API, so extraction stays on the 6.x one and
  # docs/registry.md tells hosts on 7 to alias typescript to the compatibility
  # package. node-consumer installs within the declared range and so never meets
  # a 7 host at all. This job covers both halves of that instruction: that the
  # alias works, and that its absence still fails in a way the host can act on.
  typescript7-consumer:
    name: TypeScript 7 consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Pack exactly what release publishes
        run: bun run scripts/pack.ts /tmp/yosegi-tarballs
      - name: Write the fixture host both scenarios read
        run: |
          mkdir -p /tmp/yosegi-ts7-host/components
          cat > /tmp/yosegi-ts7-host/tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ESNext",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "jsx": "react-jsx",
              "strict": true,
              "skipLibCheck": true,
              "noEmit": true
            },
            "include": ["components/**/*.tsx"]
          }
          JSON
          cat > /tmp/yosegi-ts7-host/components/badge.tsx <<'TSX'
          import type * as React from "react";

          export type BadgeProps = {
            /** The text shown inside the badge. */
            label: string;
            /** Visual weight of the badge. */
            tone?: "neutral" | "success" | "danger";
            /** Rendered to the right of the label. */
            trailing?: React.ReactNode;
          };

          export function Badge({ label, tone = "neutral", trailing }: BadgeProps) {
            return <span data-tone={tone}>{label}{trailing}</span>;
          }
          TSX
      - name: With the documented alias, extraction works on a TypeScript 7 host
        # zizmor: ignore[adhoc-packages] verifies the documented alias command
        # verbatim; a lockfile here would test something else.
        run: |
          mkdir -p /tmp/yosegi-ts7-alias
          cd /tmp/yosegi-ts7-alias
          npm init -y > /dev/null
          # Verbatim the command docs/registry.md hands to hosts on 7.
          npm install -D --no-audit --no-fund typescript@npm:@typescript/typescript6
          npm install --no-audit --no-fund /tmp/yosegi-tarballs/*.tgz react @types/react
          # The point of the alias: one copy, shared with yosegi.
          copies="$(find node_modules -type d -path "*node_modules/typescript" | wc -l)"
          find node_modules -type d -path "*node_modules/typescript"
          test "$copies" -eq 1
          node ./node_modules/.bin/yosegi registry build \
            --source "components/**/*.tsx" \
            --tsconfig /tmp/yosegi-ts7-host/tsconfig.json
          # Props have to actually come out; a written registry alone would pass empty.
          node ./node_modules/.bin/yosegi component inspect \
            "components/badge#Badge" | tee inspect.txt
          grep -q 'options: "neutral" | "success" | "danger"' inspect.txt
      - name: Without it, every other command survives and the failure names the fix
        # zizmor: ignore[adhoc-packages] deliberately installs the un-aliased
        # typescript@7 to prove the failure path; no lockfile applies.
        run: |
          mkdir -p /tmp/yosegi-ts7-bare
          cd /tmp/yosegi-ts7-bare
          npm init -y > /dev/null
          npm install -D --no-audit --no-fund typescript@7
          npm install --no-audit --no-fund /tmp/yosegi-tarballs/*.tgz
          # react-docgen-typescript reads the compiler API at import time, so a
          # static import used to kill the process before argv was even parsed.
          # docgen.ts loads it on demand; usage must still print.
          set +e
          node ./node_modules/.bin/yosegi > usage.txt 2>&1
          set -e
          cat usage.txt
          grep -q "Yosegi CLI" usage.txt
          set +e
          node ./node_modules/.bin/yosegi registry build \
            --source "components/**/*.tsx" \
            --tsconfig /tmp/yosegi-ts7-host/tsconfig.json > build.txt 2>&1
          status=$?
          set -e
          cat build.txt
          test "$status" -eq 1
          # A host reading this error has to be able to act on it without leaving it.
          grep -q "typescript@npm:@typescript/typescript6" build.txt
      - name: The same holds when Yosegi resolves the 7 as well
        # zizmor: ignore[adhoc-packages] forces the single-copy-of-7 tree the
        # scenario is about; no lockfile applies.
        run: |
          mkdir -p /tmp/yosegi-ts7-shared
          cd /tmp/yosegi-ts7-shared
          npm init -y > /dev/null
          # The scenario above leaves a nested 6.x under @yosegi/yosegi, so only the
          # hoisted extractor saw the 7. An override collapses the tree onto the host's
          # 7, which is what Yosegi's own compiler API reads then — the state where a
          # static `import * as ts` died in a module-level constant, taking every
          # command with it.
          npm pkg set devDependencies.typescript=7.0.2 overrides.typescript=7.0.2
          npm install --no-audit --no-fund /tmp/yosegi-tarballs/*.tgz
          copies="$(find node_modules -type d -path "*node_modules/typescript" | wc -l)"
          find node_modules -type d -path "*node_modules/typescript"
          test "$copies" -eq 1
          set +e
          node ./node_modules/.bin/yosegi > usage.txt 2>&1
          set -e
          cat usage.txt
          grep -q "Yosegi CLI" usage.txt
          set +e
          node ./node_modules/.bin/yosegi registry build \
            --source "components/**/*.tsx" \
            --tsconfig /tmp/yosegi-ts7-host/tsconfig.json > build.txt 2>&1
          status=$?
          set -e
          cat build.txt
          test "$status" -eq 1
          grep -q "typescript@npm:@typescript/typescript6" build.txt

  # A package whose types fail to resolve still passes both install and CLI
  # execution, so node-consumer wouldn't catch it. This job runs the
  # consumer's own tsc under two moduleResolution modes to cover it.
  types-consumer:
    name: Types consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Pack exactly what release publishes
        run: bun run scripts/pack.ts /tmp/yosegi-tarballs
      - name: Install the tarballs into a scratch consumer
        # zizmor: ignore[adhoc-packages] simulates a fresh consumer install;
        # no lockfile is the point of the test.
        run: |
          mkdir -p /tmp/yosegi-types
          cd /tmp/yosegi-types
          npm init -y > /dev/null
          npm pkg set type=module
          npm install --no-audit --no-fund typescript@5.9.3
          npm install --no-audit --no-fund /tmp/yosegi-tarballs/*.tgz
      - name: Write a consumer that touches every entry point
        run: |
          cd /tmp/yosegi-types
          cat > probe.ts <<'TS'
          import { parseScreenDefinition } from "@yosegi/core";
          import { Composer } from "@yosegi/core/app";
          import { emitCsf } from "@yosegi/core/emit";
          import { buildRegistryFromStorybook } from "@yosegi/core/registry";
          import { sampleScreen } from "@yosegi/core/testing";
          import { runCli } from "@yosegi/yosegi";

          export const check = (input: unknown) => ({
            screen: parseScreenDefinition(input),
            Composer,
            emitCsf,
            buildRegistryFromStorybook,
            sampleScreen,
            runCli,
          });
          TS
          # probe.ts would still pass even if the types collapsed to any, so also verify that misuse gets rejected.
          cat > negative.ts <<'TS'
          import { parseScreenDefinition } from "@yosegi/core";
          const wrong: number = parseScreenDefinition({});
          export { wrong };
          TS
      - name: Typecheck the consumer under both resolution modes
        run: |
          cd /tmp/yosegi-types
          for mode in bundler node16; do
            echo "--- moduleResolution: $mode ---"
            module="ESNext"
            if [ "$mode" = "node16" ]; then module="node16"; fi
            npx tsc --noEmit --strict --skipLibCheck \
              --target ESNext --module "$module" --moduleResolution "$mode" probe.ts
            # This one must not pass. If it does, the types are any and the check above passing meant nothing.
            if npx tsc --noEmit --strict --skipLibCheck \
              --target ESNext --module "$module" --moduleResolution "$mode" negative.ts 2>/dev/null; then
              echo "::error::types resolved to any under $mode"
              exit 1
            fi
          done
      - name: Check the published types against every resolution mode
        run: |
          # Both packages are ESM-only via "type": "module", so node10 and
          # require from CJS are out of scope from the start. The esm-only
          # profile excludes only those two, so this still fails as expected
          # if node16(ESM) or bundler resolution breaks.
          for tarball in /tmp/yosegi-tarballs/*.tgz; do
            npx --yes @arethetypeswrong/cli@0.18.5 --profile esm-only "$tarball"
          done

  # Guards the security posture the other workflows in this directory already
  # follow (SHA-pinned actions, minimal permissions, no persisted checkout
  # credentials): actionlint for syntax/shell/expression bugs, ghalint and
  # zizmor for policy/security findings, pinact to confirm every action stays
  # pinned by commit hash. Tool versions are pinned to what was verified
  # against this repo, not left floating.
  github-actions-security:
    name: GitHub Actions security lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # actionlint, ghalint, and pinact are Go binaries; `go install` records
      # their module checksums against the Go checksum database, so this is
      # as verifiable as a SHA pin. zizmor isn't Go, so it comes from PyPI
      # instead, into the isolated interpreter actions/setup-python provides
      # (the system Python on ubuntu-latest refuses unmanaged pip installs).
      - name: Install actionlint, ghalint, pinact
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/suzuki-shunsuke/ghalint/cmd/ghalint@v1.5.6
          go install github.com/suzuki-shunsuke/pinact/v3/cmd/pinact@v3.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install zizmor
        run: pip install zizmor==1.29.0
      - name: actionlint
        run: actionlint .github/workflows/*.yml
      - name: pinact (actions pinned by commit hash)
        run: pinact run --check .github/workflows/*.yml
      - name: ghalint (permissions, persist-credentials, timeouts, ...)
        run: ghalint run
      - name: zizmor (injection, impersonation, cache poisoning, ...)
        run: zizmor .github/workflows/
